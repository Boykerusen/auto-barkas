
name: Backup AUTO BARKAS D1

on:
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Export Cloudflare D1 database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 d1 export auto-barkas-db \
            --remote \
            --output=auto-barkas-backup.sql

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: AUTO-BARKAS-D1-Backup
          path: auto-barkas-backup.sql
          retention-days: 7
