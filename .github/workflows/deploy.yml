name: Deploy AUTO BARKAS Website

on:
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
deploy:
runs-on: ubuntu-latest

steps:
  - name: Ambil kode GitHub
    uses: actions/checkout@v4

  - name: Siapkan Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 20

  - name: Ekstrak ZIP dan build website
    shell: bash
    run: |
      set -eu

      ZIP_FILE="AUTOBARKAS-v15.zip"

      if [ ! -f "$ZIP_FILE" ]; then
        echo "ERROR: File $ZIP_FILE tidak ditemukan."
        echo "Unggah ZIP ke halaman utama repositori."
        ls -la
        exit 1
      fi

      mkdir -p site-src
      unzip -oq "$ZIP_FILE" -d site-src

      PACKAGE_JSON="$(find site-src -type f -name package.json -print -quit)"

      if [ -z "$PACKAGE_JSON" ]; then
        echo "ERROR: package.json tidak ditemukan di dalam ZIP."
        find site-src -maxdepth 3 -type f | head -80
        exit 1
      fi

      PROJECT_DIR="$(dirname "$PACKAGE_JSON")"
      echo "Folder proyek: $PROJECT_DIR"

      cd "$PROJECT_DIR"
      npm ci
      npm run build

      if [ ! -f dist/index.html ]; then
        echo "ERROR: dist/index.html tidak ditemukan."
        exit 1
      fi

      mkdir -p "$GITHUB_WORKSPACE/deploy-dist"
      cp -a dist/. "$GITHUB_WORKSPACE/deploy-dist/"

  - name: Deploy ke Cloudflare Pages
    uses: cloudflare/wrangler-action@v3
    with:
      apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      command: pages deploy deploy-dist --project-name=auto-barkas
