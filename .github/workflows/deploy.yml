
name: Build and Deploy AUTO BARKAS

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  deployments: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode dari GitHub
        uses: actions/checkout@v4

      - name: Periksa ZIP
        run: |
          test -f AUTO-BARKAS-web-v1.0-pastel.zip
          unzip -t AUTO-BARKAS-web-v1.0-pastel.zip

      - name: Ekstrak ZIP otomatis
        run: |
          mkdir -p site-src
          unzip -o AUTO-BARKAS-web-v1.0-pastel.zip -d site-src

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build website
        working-directory: site-src
        run: npm run build

      - name: Deploy ke Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site-src/dist --project-name=auto-barkas --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
