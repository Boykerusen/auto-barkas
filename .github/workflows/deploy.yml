name: Build and Deploy AUTO BARKAS

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  deployments: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Extract ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="AUTO-BARKAS-v1.10.4-perbaikan-admin-pastel.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ZIP tidak ditemukan: $ZIP_FILE"
            ls -la
            exit 1
          fi

          unzip -t "$ZIP_FILE"
          mkdir -p site-src
          unzip -oq "$ZIP_FILE" -d site-src

      - name: Find project directory
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_JSON="$(find site-src -type f -name package.json -print -quit)"

          if [ -z "$PACKAGE_JSON" ]; then
            echo "package.json tidak ditemukan"
            find site-src -maxdepth 4 -type f | head -80
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PACKAGE_JSON")"

          test -f "$PROJECT_DIR/index.html"
          test -f "$PROJECT_DIR/worker-api.js"
          test -f "$PROJECT_DIR/wrangler.toml"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build website
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          npm install
          npm run build

          test -f dist/index.html

      - name: Deploy Worker API
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.toml
          workingDirectory: ${{ env.PROJECT_DIR }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy website to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=auto-barkas --branch=main
          workingDirectory: ${{ env.PROJECT_DIR }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
