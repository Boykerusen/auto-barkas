
name: Build and Deploy AUTO BARKAS

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  deployments: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode dari GitHub
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Periksa dan ekstrak ZIP v1.2
        run: |
          set -eu
          ZIP_FILE="AUTO-BARKAS-web-v1.2-formulir.zip"

          echo "Memeriksa file proyek..."
          test -f "$ZIP_FILE"

          echo "Memeriksa isi ZIP..."
          unzip -t "$ZIP_FILE"

          mkdir -p site-src
          unzip -o "$ZIP_FILE" -d site-src

          echo "Isi proyek berhasil diekstrak."
          ls -la site-src

      - name: Siapkan folder public
        run: mkdir -p site-src/public

      - name: Periksa konfigurasi proyek
        working-directory: site-src
        run: |
          set -eu
          test -f package.json
          test -f index.html
          echo "File utama proyek ditemukan."

      - name: Build website
        working-directory: site-src
        run: |
          set -eu
          npm run build

      - name: Periksa hasil build
        run: |
          set -eu
          test -f site-src/dist/index.html
          echo "Build website berhasil."
          ls -la site-src/dist

      - name: Deploy website ke Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site-src/dist --project-name=auto-barkas --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
