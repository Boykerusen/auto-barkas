
name: Build and Deploy AUTO BARKAS

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  deployments: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode dari GitHub
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Periksa dan ekstrak ZIP
        run: |
          set -eu
          test -f AUTO-BARKAS-web-v1.1-api-search.zip
          unzip -t AUTO-BARKAS-web-v1.1-api-search.zip
          mkdir -p site-src
          unzip -o AUTO-BARKAS-web-v1.1-api-search.zip -d site-src

      - name: Siapkan folder public
        run: |
          mkdir -p site-src/public

      - name: Build website
        working-directory: site-src
        run: npm run build

      - name: Periksa hasil build
        run: |
          set -eu
          test -f site-src/dist/index.html
          echo "Build berhasil."

      - name: Buat proyek Pages jika belum ada
        uses: cloudflare/wrangler-action@v4
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create auto-barkas --production-branch=main

      - name: Deploy website ke Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site-src/dist --project-name=auto-barkas --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
