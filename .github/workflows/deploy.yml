name: Build and Deploy AUTO BARKAS

on: [push, workflow_dispatch]

jobs:
build:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4

  - uses: actions/setup-node@v4
    with:
      node-version: 20

  - name: Extract project ZIP
    shell: bash
    run: |
      set -eu
      ZIP_FILE="AUTOBARKAS-v15.zip"
      if [ ! -f "$ZIP_FILE" ]; then
        echo "ZIP tidak ditemukan: $ZIP_FILE"
        ls -la
        exit 1
      fi
      unzip -t "$ZIP_FILE"
      mkdir -p site-src
      unzip -oq "$ZIP_FILE" -d site-src

  - name: Find project and build
    shell: bash
    run: |
      set -eu
      PACKAGE_JSON="$(find site-src -type f -name package.json -print -quit)"
      if [ -z "$PACKAGE_JSON" ]; then
        echo "package.json tidak ditemukan dalam ZIP"
        find site-src -maxdepth 4 -type f | head -80
        exit 1
      fi
      PROJECT_DIR="$(dirname "$PACKAGE_JSON")"
      test -f "$PROJECT_DIR/index.html"
      cd "$PROJECT_DIR"
      npm install
      npm run build
      test -f dist/index.html
      echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

  - name: Deploy to Cloudflare Pages
    uses: cloudflare/wrangler-action@v4
    with:
      apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      command: pages deploy "${{ env.PROJECT_DIR }}/dist" --project-name=auto-barkas --branch=main
      gitHubToken: ${{ secrets.GITHUB_TOKEN }}
