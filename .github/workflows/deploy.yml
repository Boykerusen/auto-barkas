
name: Build and Deploy AUTO BARKAS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      ZIP_FILE: AUTO-BARKAS-v1.14.6-SITEMAP-SEO.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extract project ZIP
        shell: bash
        run: |
          set -e
          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP tidak ditemukan: $ZIP_FILE"
            echo "Daftar ZIP di repository:"
            ls -lah *.zip || true
            exit 1
          fi

          mkdir -p site-src
          unzip -q "$ZIP_FILE" -d site-src

          echo "ZIP berhasil diekstrak."
          find site-src -maxdepth 3 -name package.json -print

      - name: Find project directory
        shell: bash
        run: |
          set -e

          PROJECT_DIR="$(find site-src -name package.json -printf '%h\n' | head -n 1)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: package.json tidak ditemukan."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/index.html" ]; then
            echo "ERROR: index.html tidak ditemukan."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/worker-api.js" ]; then
            echo "ERROR: worker-api.js tidak ditemukan."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/wrangler.toml" ]; then
            echo "ERROR: wrangler.toml tidak ditemukan."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project ditemukan: $PROJECT_DIR"

      - name: Install dependencies and build
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

          npm run build

          if [ ! -d dist ]; then
            echo "ERROR: Folder dist tidak ditemukan."
            exit 1
          fi

          if [ ! -f dist/index.html ]; then
            echo "ERROR: dist/index.html tidak ditemukan."
            exit 1
          fi

          echo "Build berhasil."

      - name: Verify Cloudflare configuration
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          grep -q 'name = "auto-barkas-db"' wrangler.toml
          grep -q 'main = "worker-api.js"' wrangler.toml
          grep -q '8cb87089-7a98-45bf-ab0c-647b260a62c1' wrangler.toml
          grep -q 'kelqxbib' wrangler.toml
          grep -q '\*/15 \* \* \* \*' wrangler.toml

          echo "Konfigurasi Worker, D1, Cloudinary, dan Cron terverifikasi."

      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ env.PROJECT_DIR }}
          command: deploy

      - name: Deploy Cloudflare Pages
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          cd "$PROJECT_DIR"

          npx wrangler pages deploy dist \
            --project-name=auto-barkas \
            --branch=main

          echo "AUTO BARKAS berhasil di-deploy."
