
name: Build and Deploy AUTO BARKAS

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  deployments: write

concurrency:
  group: auto-barkas-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Extract ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="AUTO-BARKAS-v1.10.5-perbaikan-cloudinary-public-id.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP tidak ditemukan: $ZIP_FILE"
            echo "Isi folder repository:"
            ls -la
            exit 1
          fi

          echo "Memeriksa ZIP..."
          unzip -t "$ZIP_FILE"

          mkdir -p site-src
          unzip -oq "$ZIP_FILE" -d site-src

      - name: Find project directory
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_JSON="$(find site-src -type f -name package.json -print -quit)"

          if [ -z "$PACKAGE_JSON" ]; then
            echo "ERROR: package.json tidak ditemukan."
            find site-src -maxdepth 4 -type f | head -80
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PACKAGE_JSON")"

          echo "Memeriksa struktur proyek..."

          test -f "$PROJECT_DIR/index.html"
          test -f "$PROJECT_DIR/worker-api.js"
          test -f "$PROJECT_DIR/wrangler.toml"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Proyek ditemukan: $PROJECT_DIR"

      - name: Build website
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Memasang dependensi..."

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

          echo "Membangun website..."
          npm run build

          if [ ! -f dist/index.html ]; then
            echo "ERROR: dist/index.html tidak ditemukan."
            exit 1
          fi

          echo "Build website berhasil."

      - name: Check Worker configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Memeriksa konfigurasi Worker..."

          grep -q 'name = "auto-barkas-db"' wrangler.toml
          grep -q 'database_name = "auto-barkas-db"' wrangler.toml

          echo "Konfigurasi dasar Worker ditemukan."

      - name: Deploy Worker API
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.toml
          workingDirectory: ${{ env.PROJECT_DIR }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy website to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=auto-barkas --branch=main
          workingDirectory: ${{ env.PROJECT_DIR }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Deployment completed
        shell: bash
        run: |
          echo "================================"
          echo "AUTO BARKAS v1.10.5"
          echo "Deployment selesai."
          echo "================================"
